<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4FBF8"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E6BFF"/><stop offset="1" stop-color="#695BFF"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A56FF"/><stop offset="1" stop-color="#B148ED"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A997"/><stop offset="1" stop-color="#00C7A1"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F28B35"/><stop offset="1" stop-color="#FF5D4D"/></linearGradient>
    <pattern id="grid2" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#C8D5EC" stroke-width="1" opacity="0.24"/></pattern>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#243B72" flood-opacity="0.13"/></filter>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#4766DE"/></marker>
    <style>
      text { font-family: "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 68px; font-weight: 800; fill: #0C1B3A; letter-spacing: -1px; }
      .subtitle { font-size: 30px; font-weight: 500; fill: #53627E; }
      .kicker { font-size: 22px; font-weight: 760; fill: #3166F5; letter-spacing: 2px; }
      .col-title { font-size: 30px; font-weight: 780; fill: #102044; }
      .item-title { font-size: 23px; font-weight: 720; fill: #1D2F55; }
      .item-copy { font-size: 20px; font-weight: 510; fill: #63708A; }
      .badge { font-size: 19px; font-weight: 760; }
      .matrix-title { font-size: 26px; font-weight: 780; fill: #192C52; }
      .matrix-copy { font-size: 21px; font-weight: 560; fill: #53627E; }
      .small { font-size: 18px; font-weight: 540; fill: #7D89A0; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <rect width="1920" height="1080" fill="url(#grid2)"/>

  <text x="96" y="78" class="kicker">META-AGENT · WHY THE LOOP KEEPS WORKING</text>
  <text x="96" y="158" class="title">Auto 模式的四层可靠性栈</text>
  <text x="98" y="210" class="subtitle">保证运转，不等于无限运行：该继续时推进，该纠偏时回正，该停时可恢复</text>

  <!-- Layer 1 -->
  <g transform="translate(74 270)">
    <rect width="418" height="520" rx="34" fill="#FFFFFF" stroke="#C7D5F5" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="418" height="92" rx="34" fill="url(#g1)"/>
    <rect y="58" width="418" height="34" fill="url(#g1)"/>
    <circle cx="48" cy="46" r="24" fill="#FFFFFF" opacity="0.18"/>
    <text x="48" y="55" text-anchor="middle" font-size="26" font-weight="800" fill="white">1</text>
    <text x="86" y="55" class="col-title" fill="white">目标完整性</text>
    <text x="28" y="135" class="item-title">Goal 冻结与重锚</text>
    <text x="28" y="168" class="item-copy">原始请求独立保存；compact、resume</text>
    <text x="28" y="196" class="item-copy">之后仍作为判定基准，不靠模型记忆</text>
    <line x1="28" y1="222" x2="390" y2="222" stroke="#E2E8F6"/>
    <text x="28" y="264" class="item-title">确定性锚点</text>
    <text x="28" y="297" class="item-copy">工作区根、auto 标记、子代理状态</text>
    <text x="28" y="325" class="item-copy">在上下文压缩后继续保留</text>
    <line x1="28" y1="350" x2="390" y2="350" stroke="#E2E8F6"/>
    <rect x="28" y="382" width="164" height="38" rx="19" fill="#EAF0FF"/>
    <text x="110" y="407" text-anchor="middle" class="badge" fill="#365ACC">防止“忘记目标”</text>
    <rect x="204" y="382" width="180" height="38" rx="19" fill="#EAF0FF"/>
    <text x="294" y="407" text-anchor="middle" class="badge" fill="#365ACC">防止“续跑换题”</text>
    <text x="28" y="450" class="item-title" fill="#355AC8">控制含义</text>
    <text x="28" y="480" class="item-copy">Reference 始终稳定，所有偏差都能</text>
    <text x="28" y="508" class="item-copy">回到同一个目标坐标系中比较。</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(522 270)">
    <rect width="418" height="520" rx="34" fill="#FFFFFF" stroke="#D7C7F7" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="418" height="92" rx="34" fill="url(#g2)"/>
    <rect y="58" width="418" height="34" fill="url(#g2)"/>
    <circle cx="48" cy="46" r="24" fill="#FFFFFF" opacity="0.18"/>
    <text x="48" y="55" text-anchor="middle" font-size="26" font-weight="800" fill="white">2</text>
    <text x="86" y="55" class="col-title" fill="white">进度可观测</text>
    <text x="28" y="135" class="item-title">Atomic Checkpoint</text>
    <text x="28" y="168" class="item-copy">Todo / Artifact / 子代理 / 成本 / 轮次</text>
    <text x="28" y="196" class="item-copy">在关键边界写成单调 revision</text>
    <line x1="28" y1="222" x2="390" y2="222" stroke="#E9E1F5"/>
    <text x="28" y="264" class="item-title">真实文件变更证据</text>
    <text x="28" y="297" class="item-copy">写工具直接记录 mutated paths；连续</text>
    <text x="28" y="325" class="item-copy">10 次纯编辑后生成 edit digest</text>
    <line x1="28" y1="350" x2="390" y2="350" stroke="#E9E1F5"/>
    <rect x="28" y="382" width="164" height="38" rx="19" fill="#F2EBFF"/>
    <text x="110" y="407" text-anchor="middle" class="badge" fill="#6E48C7">崩溃后可恢复</text>
    <rect x="204" y="382" width="180" height="38" rx="19" fill="#F2EBFF"/>
    <text x="294" y="407" text-anchor="middle" class="badge" fill="#6E48C7">审查不靠叙事</text>
    <text x="28" y="450" class="item-title" fill="#6D48C7">控制含义</text>
    <text x="28" y="480" class="item-copy">Observer 记录“实际发生了什么”，</text>
    <text x="28" y="508" class="item-copy">为纠偏、续跑与验收提供事实。</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(970 270)">
    <rect width="418" height="520" rx="34" fill="#FFFFFF" stroke="#A9E0D2" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="418" height="92" rx="34" fill="url(#g3)"/>
    <rect y="58" width="418" height="34" fill="url(#g3)"/>
    <circle cx="48" cy="46" r="24" fill="#FFFFFF" opacity="0.18"/>
    <text x="48" y="55" text-anchor="middle" font-size="26" font-weight="800" fill="white">3</text>
    <text x="86" y="55" class="col-title" fill="white">纠偏与验收</text>
    <text x="28" y="135" class="item-title">Drift：中途校正</text>
    <text x="28" y="168" class="item-copy">新 checkpoint + 30 个工具批次触发</text>
    <text x="28" y="196" class="item-copy">偏离就注回 corrective，并沉淀经验</text>
    <line x1="28" y1="222" x2="390" y2="222" stroke="#DCEFE9"/>
    <text x="28" y="264" class="item-title">Verify：完成门禁</text>
    <text x="28" y="297" class="item-copy">模型声称完成时，独立 Agent 读取</text>
    <text x="28" y="325" class="item-copy">只读快照与 diff；失败最多返工 5 轮</text>
    <line x1="28" y1="350" x2="390" y2="350" stroke="#DCEFE9"/>
    <rect x="28" y="382" width="168" height="38" rx="19" fill="#E1F8F1"/>
    <text x="112" y="407" text-anchor="middle" class="badge" fill="#00866B">防止“越跑越偏”</text>
    <rect x="208" y="382" width="176" height="38" rx="19" fill="#E1F8F1"/>
    <text x="296" y="407" text-anchor="middle" class="badge" fill="#00866B">防止“假完成”</text>
    <text x="28" y="450" class="item-title" fill="#00866B">控制含义</text>
    <text x="28" y="480" class="item-copy">Feedback 不是自我反思，而是独立</text>
    <text x="28" y="508" class="item-copy">审查给出的外部纠偏信号。</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(1418 270)">
    <rect width="428" height="520" rx="34" fill="#FFFFFF" stroke="#F6C3A4" stroke-width="2" filter="url(#shadow2)"/>
    <rect width="428" height="92" rx="34" fill="url(#g4)"/>
    <rect y="58" width="428" height="34" fill="url(#g4)"/>
    <circle cx="48" cy="46" r="24" fill="#FFFFFF" opacity="0.18"/>
    <text x="48" y="55" text-anchor="middle" font-size="26" font-weight="800" fill="white">4</text>
    <text x="86" y="55" class="col-title" fill="white">自愈与止损</text>
    <text x="28" y="135" class="item-title">上下文生命线</text>
    <text x="28" y="168" class="item-copy">65% 窗口触发 compact；模型压缩</text>
    <text x="28" y="196" class="item-copy">失败后用无模型 structural truncate</text>
    <line x1="28" y1="222" x2="400" y2="222" stroke="#F3E3D9"/>
    <text x="28" y="264" class="item-title">停滞与资源闸</text>
    <text x="28" y="297" class="item-copy">全失败：3 轮提醒 / 5 轮硬停；</text>
    <text x="28" y="325" class="item-copy">预算 80% 预警，触顶后 checkpoint</text>
    <line x1="28" y1="350" x2="400" y2="350" stroke="#F3E3D9"/>
    <rect x="28" y="382" width="176" height="38" rx="19" fill="#FFF0E6"/>
    <text x="116" y="407" text-anchor="middle" class="badge" fill="#C45C22">避免烧光预算</text>
    <rect x="216" y="382" width="184" height="38" rx="19" fill="#FFF0E6"/>
    <text x="308" y="407" text-anchor="middle" class="badge" fill="#C45C22">避免上下文撞墙</text>
    <text x="28" y="450" class="item-title" fill="#C45C22">控制含义</text>
    <text x="28" y="480" class="item-copy">异常时优先自愈；无法安全推进时</text>
    <text x="28" y="508" class="item-copy">诚实停机，并保留可续跑状态。</text>
  </g>

  <!-- response matrix -->
  <rect x="74" y="830" width="1772" height="170" rx="32" fill="#FFFFFF" stroke="#D8E2F3" stroke-width="2" filter="url(#shadow2)"/>
  <text x="108" y="875" class="matrix-title">异常 → 控制动作 → Loop 结果</text>

  <g transform="translate(108 904)">
    <rect width="382" height="62" rx="20" fill="#EEF3FF"/>
    <text x="24" y="27" class="matrix-copy">方向偏移</text>
    <text x="142" y="27" class="matrix-copy" fill="#8090B5">→</text>
    <text x="178" y="27" class="matrix-copy" fill="#3B5FC7">校正注入</text>
    <text x="282" y="27" class="matrix-copy" fill="#8090B5">→</text>
    <text x="314" y="27" class="matrix-copy" fill="#3B5FC7">继续</text>
    <text x="24" y="51" class="small">Drift / Learn</text>
  </g>
  <g transform="translate(512 904)">
    <rect width="382" height="62" rx="20" fill="#E8F9F3"/>
    <text x="24" y="27" class="matrix-copy">声称完成</text>
    <text x="142" y="27" class="matrix-copy" fill="#8090B5">→</text>
    <text x="178" y="27" class="matrix-copy" fill="#00886C">独立验收</text>
    <text x="266" y="27" class="matrix-copy" fill="#8090B5">→</text>
    <text x="296" y="27" class="badge" fill="#00886C">通过/返工</text>
    <text x="24" y="51" class="small">Verify gate</text>
  </g>
  <g transform="translate(916 904)">
    <rect width="416" height="62" rx="20" fill="#FFF1E8"/>
    <text x="24" y="27" class="matrix-copy">重复失败</text>
    <text x="142" y="27" class="matrix-copy" fill="#A08D82">→</text>
    <text x="178" y="27" class="matrix-copy" fill="#C45C22">反思 / 断路</text>
    <text x="304" y="27" class="matrix-copy" fill="#A08D82">→</text>
    <text x="338" y="27" class="matrix-copy" fill="#C45C22">止损</text>
    <text x="24" y="51" class="small">Stall guard</text>
  </g>
  <g transform="translate(1354 904)">
    <rect width="458" height="62" rx="20" fill="#F1EDFF"/>
    <text x="24" y="27" class="matrix-copy">预算 / 时间触顶</text>
    <text x="176" y="27" class="matrix-copy" fill="#8E83AA">→</text>
    <text x="212" y="27" class="matrix-copy" fill="#6B4CC7">Checkpoint</text>
    <text x="332" y="27" class="matrix-copy" fill="#8E83AA">→</text>
    <text x="366" y="27" class="matrix-copy" fill="#6B4CC7">Resume</text>
    <text x="24" y="51" class="small">bounded continuity</text>
  </g>

  <text x="96" y="1044" class="small">安全底座：workspace lock + OS sandbox fail-closed · 并发写：worktree 隔离 + 写互斥 · 成本：主代理与子代理共享账本</text>
</svg>
